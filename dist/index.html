const seed={clients:[{id:1,name:'Mariana Alves',phone:'(31) 9 8842-1030',email:'mariana@email.com',last:'Hoje',total:'R$ 1.284,00'},{id:2,name:'Rafael Costa',phone:'(31) 9 7721-4992',email:'rafael@email.com',last:'Ontem',total:'R$ 986,50'},{id:3,name:'Lucas Silva',phone:'(31) 9 6154-2387',email:'lucas@email.com',last:'10 set',total:'R$ 2.140,90'}],products:[{id:1,name:'Essência Uva Ice 50g',category:'Essências',stock:4,price:'R$ 32,90'},{id:2,name:'Carvão de Coco 1kg',category:'Acessórios',stock:18,price:'R$ 42,00'},{id:3,name:'Gin Tanqueray 750ml',category:'Adega',stock:5,price:'R$ 139,90'}]};
let clients=JSON.parse(localStorage.getItem('uai_clients')||'null')||seed.clients;let products=JSON.parse(localStorage.getItem('uai_products')||'null')||seed.products;let user=JSON.parse(localStorage.getItem('uai_user')||'null');let view='Dashboard';let authMode='login';
const save=()=>{localStorage.setItem('uai_clients',JSON.stringify(clients));localStorage.setItem('uai_products',JSON.stringify(products))};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){if(!user){renderAuth();return}document.getElementById('root').innerHTML=`<div class="app"><aside class="side" id="side"><div class="identity"><img class="logo" src="logo-uai.jpg" alt="Logo Tabacaria Uai"><div><b>UAI ERP</b><small>Tabacaria e Adega</small></div></div><div class="section">GESTÃO</div><nav class="nav"><button class="${view==='Dashboard'?'active':''}" onclick="show('Dashboard')"><i>▦</i>DASHBOARD</button><button class="${view==='Clientes'?'active':''}" onclick="show('Clientes')"><i>◎</i>CLIENTES</button><button class="${view==='Produtos'?'active':''}" onclick="show('Produtos')"><i>□</i>PRODUTOS</button></nav><div class="foot">Ambiente administrativo<br>Tabacaria Uai</div></aside><div class="main"><header class="top"><button class="hamb" onclick="side.classList.toggle('open')">☰</button><div><h1>${view}</h1><p>Gestão / ${view==='Dashboard'?'Visão geral':view}</p></div><div class="profile"><em>${esc(user.name)}</em><button onclick="logout()" title="Sair"><span>${esc(user.name.charAt(0).toUpperCase())}</span></button></div></header><main class="content">${view==='Dashboard'?dashboard():view==='Clientes'?clientsPage():productsPage()}</main></div></div>${modal||''}`}
function dashboard(){return `<section class="welcome"><div><h2>Visão geral do negócio</h2><p>Acompanhe os principais movimentos da Tabacaria Uai.</p></div><span class="tag">Atualizado agora</span></section><section class="metrics"><div class="metric"><small>Vendas do mês</small><b>R$ 18.460</b><span>↑ 12,4% vs. mês anterior</span></div><div class="metric"><small>Pedidos em aberto</small><b>14</b><span>↑ 3 novos hoje</span></div><div class="metric"><small>Clientes ativos</small><b>${clients.length}</b><span>↑ base local</span></div><div class="metric"><small>Estoque baixo</small><b>${products.filter(p=>p.stock<8).length.toString().padStart(2,'0')}</b><span class="warn">Requer atenção</span></div></section><section class="grid"><article class="card"><div class="head"><h3>Clientes recentes</h3><button onclick="show('Clientes')">Ver todos</button></div><div class="rows">${clients.slice(0,3).map(c=>`<div class="row"><span class="avatar">${esc(c.name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</span><div><b>${esc(c.name)}</b><small>Última compra: ${esc(c.last||'—')}</small></div><span class="value">${esc(c.total||'—')}</span></div>`).join('')}</div></article><article class="card"><div class="head"><h3>Produtos com atenção</h3><button onclick="show('Produtos')">Abrir estoque</button></div><div class="inventory">${products.slice(0,3).map(p=>`<div class="product"><div class="product-line"><span>${esc(p.name)}</span><span class="status ${p.stock<8?'low':''}">${p.stock} un.</span></div><small>${esc(p.category)}</small><div class="bar"><span class="${p.stock<8?'low':''}" style="width:${Math.min(p.stock*5,100)}%"></span></div></div>`).join('')}</div></article></section><section class="panel"><div class="head"><h3>Últimos pedidos</h3></div><table class="table"><thead><tr><th>CLIENTE</th><th>DATA</th><th>STATUS</th><th>VALOR</th></tr></thead><tbody><tr><td>Camila Martins</td><td>16 set, 11:20</td><td><span class="status">Concluído</span></td><td>R$ 156,00</td></tr><tr><td>Diego Rocha</td><td>16 set, 10:45</td><td><span class="status">Concluído</span></td><td>R$ 92,00</td></tr></tbody></table></section>`}
function clientsPage(){return `<section class="welcome"><div><h2>Clientes</h2><p>Cadastre e acompanhe sua base de relacionamento.</p></div><button class="primary" onclick="openClient()">+ Novo cliente</button></section><section class="panel"><div class="head"><h3>${clients.length} clientes cadastrados</h3></div>${clients.length?`<table class="table"><thead><tr><th>NOME</th><th>CONTATO</th><th>ÚLTIMA COMPRA</th><th>TOTAL</th><th></th></tr></thead><tbody>${clients.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.last||'—')}</td><td>${esc(c.total||'—')}</td><td><button class="action-btn" onclick="removeClient(${c.id})">Remover</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum cliente cadastrado.</div>'}</section>`}
function productsPage(){return `<section class="welcome"><div><h2>Produtos</h2><p>Gerencie o catálogo e acompanhe os níveis de estoque.</p></div><button class="primary" onclick="openProduct()">+ Novo produto</button></section><section class="panel"><div class="head"><h3>${products.length} produtos em catálogo</h3></div>${products.length?`<table class="table"><thead><tr><th>PRODUTO</th><th>CATEGORIA</th><th>ESTOQUE</th><th>PREÇO</th><th></th></tr></thead><tbody>${products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td><span class="status ${p.stock<8?'low':''}">${p.stock} un.</span></td><td>${esc(p.price)}</td><td><button class="action-btn" onclick="removeProduct(${p.id})">Remover</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum produto cadastrado.</div>'}</section>`}
let modal='';function openClient(){modal=`<div class="modal"><div class="modal-card"><h3>Novo cliente</h3><p>Adicione um cliente à sua base local.</p><form class="form" onsubmit="addClient(event)"><label>Nome<input name="name" required placeholder="Nome completo"></label><label>Telefone<input name="phone" required placeholder="(31) 9 0000-0000"></label><label>E-mail<input name="email" type="email" placeholder="cliente@email.com"></label><div style="display:flex;gap:8px;margin-top:8px"><button class="secondary" type="button" onclick="closeModal()">Cancelar</button><button class="primary" type="submit">Salvar cliente</button></div></form></div></div>`;render()};function openProduct(){modal=`<div class="modal"><div class="modal-card"><h3>Novo produto</h3><p>Adicione um item ao catálogo local.</p><form class="form" onsubmit="addProduct(event)"><label>Produto<input name="name" required placeholder="Nome do produto"></label><label>Categoria<input name="category" required placeholder="Essências, Adega..."></label><label>Estoque<input name="stock" type="number" min="0" required placeholder="0"></label><label>Preço<input name="price" required placeholder="R$ 0,00"></label><div style="display:flex;gap:8px;margin-top:8px"><button class="secondary" type="button" onclick="closeModal()">Cancelar</button><button class="primary" type="submit">Salvar produto</button></div></form></div></div>`;render()};function closeModal(){modal='';render()};function addClient(e){e.preventDefault();let f=new FormData(e.target);clients.unshift({id:Date.now(),name:f.get('name'),phone:f.get('phone'),email:f.get('email'),last:'Novo',total:'R$ 0,00'});save();closeModal()};function addProduct(e){e.preventDefault();let f=new FormData(e.target);products.unshift({id:Date.now(),name:f.get('name'),category:f.get('category'),stock:Number(f.get('stock')),price:f.get('price')});save();closeModal()};function removeClient(id){if(confirm('Remover este cliente?')){clients=clients.filter(c=>c.id!==id);save();render()}}function removeProduct(id){if(confirm('Remover este produto?')){products=products.filter(p=>p.id!==id);save();render()}}function show(v){view=v;render()};function logout(){user=null;localStorage.removeItem('uai_user');render()}
function renderAuth(){document.getElementById('root').innerHTML=`<div class="auth"><section class="auth-brand"><div class="auth-brand-inner"><img src="logo-uai.jpg" alt="Logo Tabacaria Uai"><h1>UAI ERP</h1><p>Gestão simples e inteligente para a sua tabacaria e adega.</p></div></section><section class="auth-card"><div class="auth-box"><h2>${authMode==='login'?'Entrar no Uai ERP':'Criar sua conta'}</h2><p class="sub">${authMode==='login'?'Acesse o painel da Tabacaria Uai.':'Comece a organizar sua operação.'}</p><form class="form" onsubmit="auth(event)">${authMode==='signup'?'<label>Nome completo<input name="name" required placeholder="Seu nome"></label>':''}<label>${authMode==='login'?'E-mail ou usuário':'E-mail'}<input name="email" type="text" required placeholder="${authMode==='login'?'admin ou voce@email.com':'voce@email.com'}"></label><label>Senha<input name="password" type="password" required minlength="4" placeholder="Mínimo de 4 caracteres"></label><div id="auth-error"></div><button class="primary" type="submit">${authMode==='login'?'Entrar':'Criar conta'}</button></form><div class="switch">${authMode==='login'?'Ainda não tem conta?':'Já tem uma conta?'} <button onclick="authMode=authMode==='login'?'signup':'login';render()">${authMode==='login'?'Criar agora':'Entrar'}</button></div><p style="font-size:11px;color:#9aa39e;margin-top:24px;line-height:1.5">Os dados ficam protegidos no Supabase.</p></div></section></div>`}
function auth(e){e.preventDefault();let f=new FormData(e.target),email=f.get('email').toLowerCase(),password=f.get('password');if(authMode==='signup'){let u={name:f.get('name'),email,password};localStorage.setItem('uai_account',JSON.stringify(u));user={name:u.name,email:u.email};localStorage.setItem('uai_user',JSON.stringify(user));render()}else{let u=JSON.parse(localStorage.getItem('uai_account')||'null');if(!u||u.email!==email||u.password!==password){document.getElementById('auth-error').innerHTML='<div class="error">E-mail ou senha inválidos.</div>';return}user={name:u.name,email:u.email};localStorage.setItem('uai_user',JSON.stringify(user));render()}}
render();
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://vziselnfwyeabxqvpesx.supabase.co','sb_publishable_uIitXctMXEBZyFSEVfmvJg_EUOwfMSY');
let currentProfile=null;
async function loadRemote(){const [{data:cs},{data:ps},{data:pr}]=await Promise.all([sb.from('clients').select('*').is('deleted_at',null).order('created_at',{ascending:false}),sb.from('products').select('*').is('deleted_at',null).order('created_at',{ascending:false}),sb.from('profiles').select('*').eq('id',(await sb.auth.getUser()).data.user.id).single()]);if(cs)clients=cs.map(c=>({id:c.id,name:c.name,phone:c.phone,email:c.email,last:new Date(c.created_at).toLocaleDateString('pt-BR'),total:'—'}));if(ps)products=ps.map(p=>({id:p.id,name:p.name,category:p.description||'Sem categoria',stock:p.quantity,price:'R$ '+Number(p.price).toFixed(2).replace('.',','),description:p.description,photo_url:p.photo_url}));currentProfile=pr||null;if(currentProfile&&user){user.name=currentProfile.full_name||user.name;user.role=currentProfile.role}};
async function bootRemote(){const {data:{session}}=await sb.auth.getSession();if(!session){user=null;render();return}user={name:session.user.user_metadata?.full_name||session.user.email.split('@')[0],email:session.user.email};await loadRemote();render()};
async function auth(e){e.preventDefault();const f=new FormData(e.target),email=String(f.get('email')).trim().toLowerCase(),password=String(f.get('password'));if(authMode==='signup'){const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:f.get('name')}}});if(error){document.getElementById('auth-error').innerHTML='<div class="error">'+esc(error.message)+'</div>';return}if(!data.session){document.getElementById('auth-error').innerHTML='<div class="error" style="color:#527653">Verifique seu e-mail para ativar a conta.</div>';return}}else{const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){document.getElementById('auth-error').innerHTML='<div class="error">E-mail ou senha inválidos.</div>';return}user={name:data.user.user_metadata?.full_name||email.split('@')[0],email}}await loadRemote();render()};
async function logout(){await sb.auth.signOut();user=null;currentProfile=null;render()};
async function addClient(e){e.preventDefault();const f=new FormData(e.target),uid=(await sb.auth.getUser()).data.user.id;const {error}=await sb.from('clients').insert({name:f.get('name'),phone:f.get('phone'),email:f.get('email'),created_by:uid});if(error){alert(error.message);return}await loadRemote();closeModal()};
async function addProduct(e){e.preventDefault();const f=new FormData(e.target),uid=(await sb.auth.getUser()).data.user.id;const price=Number(String(f.get('price')).replace(/[^0-9,]/g,'').replace(',','.'))||0;let photo_url=null;const file=f.get('photo');if(file&&file.size){const path=uid+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'');const up=await sb.storage.from('product-photos').upload(path,file);if(up.error){alert(up.error.message);return}photo_url=sb.storage.from('product-photos').getPublicUrl(path).data.publicUrl}const {error}=await sb.from('products').insert({name:f.get('name'),price,description:f.get('description'),photo_url,quantity:Number(f.get('stock'))||0,created_by:uid});if(error){alert(error.message);return}await loadRemote();closeModal()};
async function removeClient(id){if(confirm('Remover este cliente?')){const {error}=await sb.from('clients').delete().eq('id',id);if(error){alert(error.message);return}await loadRemote();render()}}async function removeProduct(id){if(confirm('Remover este produto?')){const {error}=await sb.from('products').delete().eq('id',id);if(error){alert(error.message);return}await loadRemote();render()}}
const oldOpenProduct=openProduct;openProduct=function(){modal=`<div class="modal"><div class="modal-card"><h3>Novo produto</h3><p>Cadastre um produto e atualize o estoque.</p><form class="form" onsubmit="addProduct(event)"><label>Nome<input name="name" required placeholder="Nome do produto"></label><label>Preço<input name="price" required placeholder="R$ 0,00"></label><label>Descrição<input name="description" placeholder="Categoria ou descrição"></label><label>Foto<input name="photo" type="file" accept="image/*"></label><label>Quantidade<input name="stock" type="number" min="0" required placeholder="0"></label><div style="display:flex;gap:8px;margin-top:8px"><button class="secondary" type="button" onclick="closeModal()">Cancelar</button><button class="primary" type="submit">Salvar produto</button></div></form></div></div>`;render()};

async function fillAdmin(){const {data:ps}=await sb.from('profiles').select('*').order('created_at',{ascending:false});document.getElementById('admin-users').innerHTML=(ps||[]).map(p=>`<div class="row"><span class="avatar">${esc(p.full_name.slice(0,2).toUpperCase())}</span><div><b>${esc(p.full_name)}</b><small>${esc(p.username||'usuário')}</small></div><select onchange="updateRole('${p.id}',this.value)" style="border:1px solid #dbe2dd;border-radius:6px;padding:6px;font-size:12px"><option ${p.role==='ADMINISTRADOR'?'selected':''}>ADMINISTRADOR</option><option ${p.role==='OPERADOR'?'selected':''}>OPERADOR</option><option ${p.role==='USUARIO COMUM'?'selected':''}>USUARIO COMUM</option></select></div>`).join('')||'<div class="empty">Nenhum usuário.</div>';const {data:logs}=await sb.from('audit_logs').select('*').order('created_at',{ascending:false}).limit(20);document.getElementById('admin-audit').innerHTML=(logs||[]).map(l=>`<div class="row"><span class="avatar">${l.action==='ADD'?'+':'−'}</span><div><b>${l.action==='ADD'?'Adição':'Remoção'} de ${l.entity_type==='CLIENT'?'cliente':'produto'}</b><small>${esc(l.details?.name||'Registro')} · ${new Date(l.created_at).toLocaleString('pt-BR')}</small></div><span class="status">${l.action}</span></div>`).join('')||'<div class="empty">Nenhuma atividade registrada.</div>'}

</script><script>const _supabaseAuth=auth;window.auth=async function(e){const field=e.target.elements.email;if(field&&field.value.trim().toLowerCase()==='admin')field.value='admin@tabacariauai.com.br';return _supabaseAuth(e)};const _loadRemote=loadRemote;loadRemote=async function(){await _loadRemote();if(currentProfile&&user){user.must_change_password=!!currentProfile.must_change_password;user.avatar_url=currentProfile.avatar_url||''}};renderAuth=function(){document.getElementById('root').innerHTML='<div class="auth"><section class="auth-brand"><div class="auth-brand-inner"><img src="logo-uai.jpg" alt="Logo Tabacaria Uai"><h1>UAI ERP</h1><p>Gestão simples e inteligente para a sua tabacaria e adega.</p></div></section><section class="auth-card"><div class="auth-box"><h2>Entrar no Uai ERP</h2><p class="sub">Acesse o painel da Tabacaria Uai.</p><form class="form" onsubmit="auth(event)"><label>E-mail ou usuário<input name="email" type="text" required autocomplete="username" placeholder="admin ou voce@email.com"></label><label>Senha<input name="password" type="password" required autocomplete="current-password" placeholder="Sua senha"></label><div id="auth-error"></div><button class="primary" type="submit">Entrar</button></form><p style="font-size:11px;color:#9aa39e;margin-top:24px;line-height:1.5">A criação de acessos é feita pelo Painel Administrativo.</p></div></section></div>'};function changePassword(){modal='<div class="modal"><div class="modal-card"><h3>Alterar senha</h3><p>Escolha uma nova senha segura.</p><form class="form" onsubmit="savePassword(event)"><label>Nova senha<input name="password" type="password" required minlength="8" placeholder="Mínimo de 8 caracteres"></label><label>Confirmar senha<input name="confirm" type="password" required minlength="8" placeholder="Repita a nova senha"></label><div id="password-error"></div><div style="display:flex;gap:8px;margin-top:8px"><button class="secondary" type="button" onclick="closeModal()">Cancelar</button><button class="primary" type="submit">Atualizar senha</button></div></form></div></div>';render()};async function savePassword(e){e.preventDefault();const f=new FormData(e.target);if(f.get('password')!==f.get('confirm')){document.getElementById('password-error').innerHTML='<div class="error">As senhas não coincidem.</div>';return}const {error}=await sb.auth.updateUser({password:f.get('password')});if(error){document.getElementById('password-error').innerHTML='<div class="error">'+esc(error.message)+'</div>';return}await sb.from('profiles').update({must_change_password:false}).eq('id',(await sb.auth.getUser()).data.user.id);user.must_change_password=false;closeModal()};function accountMenu(){const el=document.getElementById('account-menu');if(el)el.remove();else{const p=document.querySelector('.profile');p.insertAdjacentHTML('beforeend','<div id="account-menu" style="position:absolute;right:28px;top:58px;width:230px;background:#fff;border:1px solid #e2e7e9;border-radius:10px;padding:14px;box-shadow:0 14px 34px #17211824;z-index:8"><div style="display:flex;gap:10px;align-items:center"><span class="avatar">'+esc(user.name.slice(0,2).toUpperCase())+'</span><div><b style="font-size:13px">'+esc(user.name)+'</b><small style="display:block;color:#7d8781;margin-top:3px">'+esc(user.email)+'</small></div></div><div style="border-top:1px solid #edf0f1;margin:12px -14px 8px"></div><button class="link-btn" style="display:block;padding:8px 0" onclick="changePassword()">Alterar senha</button><button class="link-btn" style="display:block;padding:8px 0" onclick="showHistory()">Histórico</button><button class="link-btn" style="display:block;padding:8px 0;color:#a74332" onclick="logout()">Sair</button></div>')}}async function showHistory(){accountMenu();if(user.role!=='ADMINISTRADOR'){alert('O histórico está disponível apenas para administradores.');return}view='Admin';render()};function avatarPicker(){let i=document.createElement('input');i.type='file';i.accept='image/png,image/jpeg,image/webp';i.onchange=uploadAvatar;i.click()};async function uploadAvatar(e){const file=e.target.files[0];if(!file)return;if(file.size>2*1024*1024){alert('A foto deve ter no máximo 2 MB.');return}if(!['image/png','image/jpeg','image/webp'].includes(file.type)){alert('Use PNG, JPG ou WEBP.');return}const uid=(await sb.auth.getUser()).data.user.id,path=uid+'/avatar-'+Date.now();const up=await sb.storage.from('profile-avatars').upload(path,file,{upsert:true});if(up.error){alert(up.error.message);return}const url=sb.storage.from('profile-avatars').getPublicUrl(path).data.publicUrl;const {error}=await sb.from('profiles').update({avatar_url:url}).eq('id',uid);if(error){alert(error.message);return}user.avatar_url=url;render()};const _render=render;render=function(){_render();if(user&&user.must_change_password){document.querySelector('.content').innerHTML='<section class="panel" style="max-width:620px;margin:60px auto"><h2 style="margin-top:0">Atualize sua senha</h2><p>Por segurança, você precisa definir uma nova senha antes de continuar.</p><button class="primary" onclick="changePassword()">Alterar senha agora</button></section>';document.querySelectorAll('.nav button').forEach(b=>b.disabled=true)}if(user){const p=document.querySelector('.profile');if(p){p.style.position='relative';p.onclick=accountMenu;const s=p.querySelector('span');if(s&&user.avatar_url){s.innerHTML='<img src="'+esc(user.avatar_url)+'" style="width:31px;height:31px;object-fit:cover;border-radius:50%">';s.onclick=(e)=>{e.stopPropagation();avatarPicker()}}}}};
</script><script>async function createAccess(e){e.preventDefault();const f=new FormData(e.target),session=(await sb.auth.getSession()).data.session;const r=await fetch('https://vziselnfwyeabxqvpesx.supabase.co/functions/v1/admin-create-user',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token,apikey:'sb_publishable_uIitXctMXEBZyFSEVfmvJg_EUOwfMSY'},body:JSON.stringify({name:f.get('name'),email:f.get('email'),role:f.get('role')})});const d=await r.json();if(!r.ok){document.getElementById('access-error').innerHTML='<div class="error">'+esc(d.error||'Não foi possível criar o acesso.')+'</div>';return}alert('Acesso criado. Senha inicial: '+d.temporary_password);closeModal();if(view==='Admin')fillAdmin()};function openAccess(){modal='<div class="modal"><div class="modal-card"><h3>Novo acesso</h3><p>A senha inicial será definida automaticamente e deverá ser trocada no primeiro login.</p><form class="form" onsubmit="createAccess(event)"><label>Nome completo<input name="name" required placeholder="Nome do colaborador"></label><label>E-mail<input name="email" type="email" required placeholder="colaborador@email.com"></label><label>Cargo<select name="role" required style="width:100%;padding:11px 12px;border:1px solid #dbe2dd;border-radius:8px;font-size:14px"><option>OPERADOR</option><option>ADMINISTRADOR</option></select></label><div id="access-error"></div><div style="display:flex;gap:8px;margin-top:8px"><button class="secondary" type="button" onclick="closeModal()">Cancelar</button><button class="primary" type="submit">Criar acesso</button></div></form></div></div>';render()};const _oldFill=fillAdmin;fillAdmin=async function(){await _oldFill();document.querySelectorAll('#admin-users option').forEach(o=>{if(o.textContent==='USUARIO COMUM')o.remove()});document.querySelectorAll('#admin-users select').forEach(s=>{const row=s.closest('.row');if(row&&row.querySelector('small')?.textContent==='admin')s.disabled=true})};const _oldNewRender=render;render=function(){_oldNewRender();if(user&&user.role==='ADMINISTRADOR'&&view==='Admin'){const head=document.querySelector('.content .head');if(head&&!head.querySelector('[data-new-access]'))head.insertAdjacentHTML('beforeend','<button data-new-access class="primary" style="padding:9px 12px" onclick="openAccess()">+ Novo acesso</button>')}};</script></body></html>
